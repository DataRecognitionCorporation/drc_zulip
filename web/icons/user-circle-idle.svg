<!--
DRC: The away icon from Zulip 9.2: a 1px ring with its bottom half
filled. The ring is drawn clockwise and the empty top half of the
inside counterclockwise, so the top half is a hole under the nonzero
fill rule that icon fonts use.
-->
<svg viewBox="0 0 11 11" xmlns="http://www.w3.org/2000/svg">
    <path d="M 0 5.5 A 5.5 5.5 0 1 1 11 5.5 A 5.5 5.5 0 1 1 0 5.5 Z M 1 5.5 L 10 5.5 A 4.5 4.5 0 0 0 1 5.5 Z"/>
</svg>
